[project]
name = "mosaic"
version = "1.0.0"
description = "MOSAIC: Multi-agent Open-ended Scientific Analysis and Investigation through Collaboration"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "click>=8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mosaic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --timeout=60"
markers = [
    "slow: integration tests that touch Slurm or run a real ED",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-timeout>=2.2",
]
