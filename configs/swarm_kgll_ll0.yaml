# Campaign kgll-ll0-1 as run (model 1, before the search boundary was set); agents read
# swarm/missions/kgll-ll0-nk21/mission.md. The bounded campaigns' configs derive from this one.
# Site-specific values are placeholders: Slurm partitions (cpu, gpu-h100, gpu-a100), the julia and claude
# binaries, and agent_deny_read (the campaigns hid the analysis folders and development history from the agents).
#
#   uv run python -m mosaic.swarm pes-cases --config configs/swarm_kgll_ll0.yaml > <cases>
#   julia --project=<snapshot>/julia scripts/pes_expected_counts.jl <snapshot> <cases> <gates.pes_expected_counts>
#   uv run python -m mosaic.swarm setup --config configs/swarm_kgll_ll0.yaml
#   scripts/swarm_login.sh configs/swarm_kgll_ll0.yaml
#
# DECISION marks operator choices (strategy is the agents').

swarm_id: kgll-ll0-1
root: runs_swarm/kgll-ll0-1
worktree_root: ../mosaic-wt/kgll-ll0-1

arms:                                             # 18 shared + 2 private
  swarm:
    mode: shared
    agents: [swarm-a, swarm-b, swarm-c, swarm-d, swarm-e, swarm-f, swarm-g, swarm-h, swarm-i, swarm-j, swarm-k, swarm-l, swarm-m, swarm-n, swarm-o, swarm-p, swarm-q, swarm-r]
  control:
    mode: private
    agents: [ctrl-a, ctrl-b]

mission: swarm/missions/kgll-ll0-nk21/mission.md   # no predefined directions

regime:
  # Interaction / normalization extras (d_s = 0.1, qmax 8, W0, ...) and units.
  template_ed_input: runs_kgll_pilot/p024_base_st/ed_input.json
  a_n: [1, 0, 0]                                  # pure LL0
  pin_static: true                                # only the deformation is free

parents:
  w3:                                             # primary benchmark
    shells: ["0", "0", "3/5", "0", "0", "1/4", "0", "1/8"]
    expected_gap:                                 # reference gaps (same solver, same inputs)
      s21: 0.0004571428567841414
      s21c: 0.0004571326005218679
    expected_rtol: {s21: 1.0e-4, s21c: 1.0e-6}   # search mode varies ~1e-5 between runs
  w2:                                             # independent secondary parent
    shells: ["0", "-1/3", "0", "0", "1/3", "-1/6", "0", "0"]
    expected_gap:
      s21: 0.00032271049836679014
      s21c: 0.00032271017557684097
    expected_rtol: {s21: 1.0e-4, s21c: 1.0e-6}
  lll:                                            # uniform pure LL0: Δ_LLL for the diagnostic ratios
    shells: ["0", "0", "0", "0", "0", "0", "0", "0"]
    role: diagnostic
lll_parent: lll

clusters:
  s21:    {symcluster: 1, n_k: 21, tier: cpu, ed_accuracy: search,  chern: skip, pes_na: 2}
  s21c:   {symcluster: 1, n_k: 21, tier: cpu, ed_accuracy: confirm, chern: skip, pes_na: 3}
  # Rectangular clusters: the (1,3) rule's orbital order does not fit them, so
  # their momentum-resolved counts come from the uniform-LLL Laughlin state's
  # measured PES at the closed-form total.
  r46:    {nk1: 4, nk2: 6, tier: cpu, ed_accuracy: confirm, chern: match_parent, pes_na: 2, pes_reference: lll}
  r56:    {nk1: 5, nk2: 6, tier: gpu, ed_accuracy: confirm, chern: match_parent, pes_na: 2, pes_reference: lll}
  # Convergence rerun (real-space mesh, kernel harmonic cutoff, qmax).
  conv46: {nk1: 4, nk2: 6, tier: cpu, ed_accuracy: confirm, chern: match_parent, pes_na: 2, pes_reference: lll,
           extra_overrides: {qmax: 10}, deformation_overrides: {n_mesh: 64, g_cutoff: 10}}
  # Overrides only tighten: each is max(request's value, override).

stages:                                           # thresholds: DECISION (promotion is not a claim)
  - {name: screen,    clusters: [s21]}
  - {name: confirm21, clusters: [s21c],  promote_min_R_gap: 1.02}
  - {name: r46,       clusters: [r46],   promote_min_R_gap: 1.0}
  - {name: r56,       clusters: [r56],   promote_min_R_gap: 1.0}
  - {name: converge,  clusters: [conv46], promote_min_R_gap: 1.05, promote_on: [r46, r56]}   # Nk=21: sign only (brief)

claims:                                           # the brief's definitions, strongest first
  - name: strong
    all_clusters: [s21, r46, r56, conv46]
    min_R_gap: {r46: 1.10, r56: 1.10, conv46: 1.10}
  - name: robust_positive
    all_clusters: [s21, r46, r56, conv46]
    min_R_gap: {r46: 1.05, r56: 1.05, conv46: 1.05}
  - name: suggestive
    all_clusters: [s21, r46, r56]

gates:
  split_max: 0.1
  pes_gap_pass: 0.5
  pes_expected_counts: swarm/templates/pes_expected_counts.json
  admissibility_min_ratio: 1.0e-6
  admissibility_grid: 24

quotas:                                           # DECISION
  evaluations_per_agent: 500
  max_in_flight_per_agent: 32

deadline_utc: null

broker:
  backend: slurm
  tick_seconds: 30
  max_retries: 1
  idle_exit_seconds: 600
  julia: julia
  solver_ref: HEAD                             # solver v0.9.1 (accuracy settings + PES); pin a tag of this repository
  solver_version_prefix: moire-julia-ed@v0.9.1
  tiers:
    cpu:                                          # Nk=21 (seconds) and 4×6 (~40 s persistent)
      partition: cpu
      reservation: null
      qos: null
      lanes: 8
      threads: 4
      mem: 64G
      walltime: "04:00:00"
      max_jobs: 3
      est_run_seconds: 300
      lane_mode: persistent
    gpu:                                          # 5×6 (~40 s persistent on H100)
      # Either GPU partition, whichever starts first: the control arm's 5×6 was
      # blocked for hours waiting for an H100 (2026-10-02).
      partition: gpu-h100,gpu-a100
      lanes: 2
      threads: 4
      gpus: 2
      mem: 64G
      walltime: "08:00:00"
      max_jobs: 1
      est_run_seconds: 600
      lane_mode: persistent

agent_job:
  # 4 h chunks on the group's short reservation: a 48 h, 36-core job could not
  # be backfilled around another project's 96-core array (2026-10-02). The
  # supervisor resubmits at each walltime and agents resume their sessions.
  partition: cpu
  reservation: null
  qos: null
  cpus_per_agent: 2
  mem_per_agent_gb: 4
  walltime: "04:00:00"
  stagger_seconds: 60                            # 18 agents: the last starts after ~17 min
  claude: claude
  model: null
  permission_mode: auto
